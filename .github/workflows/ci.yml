name: CI

on:
  pull_request:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
    inputs:
      release_build:
        description: "Build release artifacts"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 固定到本地验证过的版本。此前用 `channel: stable` 是浮动版本，格式门禁的
  # 结果绑死在 dart_style 上：stable 一升级、格式化规则一变，CI 就会因为与代码
  # 无关的原因变红。升级时改这里一处即可（两个 workflow 各有一份）。
  FLUTTER_VERSION: 3.47.7
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UMENG_ANDROID_APPKEY: ${{ secrets.UMENG_ANDROID_APPKEY }}
  UMENG_CHANNEL: ${{ secrets.UMENG_CHANNEL }}
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

jobs:
  quality:
    name: Analyze + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: dart tool/inkpaper.dart store-check
      # 本地和 CI 走同一条命令：deps → 格式门禁 → analyze → test。
      # 顺序不能调：没有 .dart_tool/package_config.json 时 dart format 读不到项目的
      # 语言版本（pubspec >=3.0.0 → 3.0），会退回 SDK 最新版的 tall style，与实际
      # 使用的 short style 产生上百个假差异，格式门禁必然红。
      - name: verify（deps → 格式门禁 → analyze → test）
        shell: bash
        run: |
          set -o pipefail
          dart tool/inkpaper.dart verify --coverage 2>&1 | tee "$RUNNER_TEMP/verify.log"
      # 步骤失败时 GitHub 只给「Process completed with exit code 1」。把日志里
      # 的关键行转成 check annotation —— 公开仓库匿名可读，排查不必登录。
      - name: 失败日志（转 annotation）
        if: failure()
        shell: bash
        run: bash scripts/ci_annotate.sh "$RUNNER_TEMP/verify.log"
      - name: Upload coverage
        uses: actions/upload-artifact@v6
        with:
          name: coverage-lcov
          path: coverage/lcov.info

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install gitleaks
        shell: bash
        run: |
          set -o pipefail
          # 和 gradle 发行包一样，这是 GitHub Releases 的资产下载，会 504 抖动。
          url=https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          for attempt in 1 2 3 4; do
            if curl -sSfL --retry 2 --retry-delay 5 "$url" \
              | sudo tar -xz -C /usr/local/bin gitleaks; then
              break
            fi
            echo "gitleaks download failed (attempt $attempt), retrying"
            sleep 10
          done
          gitleaks version
      - name: Scan working tree
        run: gitleaks detect --no-git --redact -v --exit-code=2 --config=.gitleaks.toml

  android:
    name: Android
    runs-on: ubuntu-latest
    needs: [quality, secret-scan]
    steps:
      - uses: actions/checkout@v6
      # ubuntu-latest 自带 JDK 已到 25，而项目的 Gradle 8.14.3 支持不到那一档，
      # 构建会直接报 "The Java version used for the build is 25.0.5, which is
      # incompatible with Gradle 8.14.3"。钉到本地验证过的 Temurin 17。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Gradle 的发行包所有官方地址（services/downloads.gradle.org）都会 307 到
      # github.com/gradle/gradle-distributions/releases，Actions runner 拉自家
      # release 资产时不时 504，重试三次也不一定过得去。
      # 原来只缓存 ~/.gradle/wrapper/dists：发行包确实不用重下了，但 ~/.gradle/caches
      # 里那几百 MB 依赖每次仍要从 Maven 重拉 —— 实测 assembleDebug 报 550.5s，
      # 其中 254 秒是没有任何日志的静默下载。官方的 setup-gradle 会一并管住
      # wrapper 与 caches（key 按 gradle 脚本的哈希算，改构建脚本才失效），
      # cache-cleanup 顺手删掉本次没用到的条目，避免缓存无限膨胀。
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: dart tool/inkpaper.dart deps
      - name: Restore Android signing files
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_build }}
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_STORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Android release signing secrets are incomplete." >&2
            exit 1
          fi
          mkdir -p android
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/inkpaper-new-release.keystore
          {
            echo "storeFile=../inkpaper-new-release.keystore"
            echo "storePassword=$ANDROID_STORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties
          chmod 600 android/inkpaper-new-release.keystore android/key.properties
      - name: Build debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.release_build }}
        shell: bash
        run: |
          set -o pipefail
          # gradlew 第一次要从镜像源下载 gradle 发行包，偶发失败
          # （Server returned HTTP response code: 504）。失败时 wrapper 会清掉半截
          # 文件，所以整体重试是安全的；三次都失败才真的红。
          # 每次 attempt 写独立日志：共用一份会被后一次覆盖，而失败常常只在
          # 第一次留下真实原因（后续 attempt 命中缓存，几秒就复现同一个红）。
          for attempt in 1 2 3; do
            echo "== build attempt $attempt =="
            if dart tool/inkpaper.dart build android-debug 2>&1 | tee "$RUNNER_TEMP/build-$attempt.log"; then
              exit 0
            fi
            echo "== attempt $attempt failed, retrying =="
            sleep 20
          done
          exit 1
      - name: 失败日志（转 annotation）
        if: failure()
        shell: bash
        run: bash scripts/ci_annotate.sh "$RUNNER_TEMP"/build-*.log
      - name: Build release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_build }}
        run: dart tool/inkpaper.dart build android-release
      - name: Build release AAB
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_build }}
        run: dart tool/inkpaper.dart build android-aab
      - name: Upload Android artifact
        uses: actions/upload-artifact@v6
        with:
          name: android-package
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab

  # 把 main 上的提交同步到 Gitee 镜像，方便国内 clone / pull。
  # 没配 GITEE_TOKEN 的仓库会直接跳过，不会把 CI 弄红。
  mirror:
    name: Mirror to Gitee
    runs-on: ubuntu-latest
    needs: [quality]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # 同一时间只允许一个作业往 Gitee 推。这个组和 release.yml 的 mirror-gitee 共用：
    # Gitee 的附件上传通道一次只能好好服务一个 50MB 的上传，1.1.82 / 1.1.83 两次发版
    # 并发推的时候，后一个的 APK 被挤掉，Release 建好了资产却是空的 —— 而 latest
    # 已经指向它，用户点「更新」直接 404。后来者排队，而不是互相抢。
    # 排队组只影响这一个 job，不会取消别人的构建。
    concurrency:
      group: gitee-sync
      cancel-in-progress: false
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
    steps:
      - name: Skip (GITEE_TOKEN not configured)
        if: env.GITEE_TOKEN == ''
        run: echo 'GITEE_TOKEN 未配置，跳过 Gitee 镜像同步。'
      - uses: actions/checkout@v6
        if: env.GITEE_TOKEN != ''
        with:
          fetch-depth: 0
      - name: Push code and tags
        if: env.GITEE_TOKEN != ''
        shell: bash
        env:
          MIRROR_ONLY: '1'
        run: bash scripts/publish_gitee.sh
