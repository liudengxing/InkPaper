name: CI

on:
  pull_request:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
    inputs:
      release_build:
        description: "Build release artifacts"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 固定到本地验证过的版本。此前用 `channel: stable` 是浮动版本，格式门禁的
  # 结果绑死在 dart_style 上：stable 一升级、格式化规则一变，CI 就会因为与代码
  # 无关的原因变红。升级时改这里一处即可（两个 workflow 各有一份）。
  FLUTTER_VERSION: 3.47.7
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UMENG_ANDROID_APPKEY: ${{ secrets.UMENG_ANDROID_APPKEY }}
  UMENG_CHANNEL: ${{ secrets.UMENG_CHANNEL }}
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

jobs:
  quality:
    name: Analyze + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: dart tool/inkpaper.dart store-check
      # 本地和 CI 走同一条命令：deps → 格式门禁 → analyze → test。
      # 顺序不能调：没有 .dart_tool/package_config.json 时 dart format 读不到项目的
      # 语言版本（pubspec >=3.0.0 → 3.0），会退回 SDK 最新版的 tall style，与实际
      # 使用的 short style 产生上百个假差异，格式门禁必然红。
      - run: dart tool/inkpaper.dart verify --coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
      - name: Scan working tree
        run: gitleaks detect --no-git --redact -v --exit-code=2 --config=.gitleaks.toml

  android:
    name: Android
    runs-on: ubuntu-latest
    needs: [quality, secret-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: dart tool/inkpaper.dart deps
      - name: Restore Android signing files
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_build }}
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_STORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Android release signing secrets are incomplete." >&2
            exit 1
          fi
          mkdir -p android
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/inkpaper-new-release.keystore
          {
            echo "storeFile=../inkpaper-new-release.keystore"
            echo "storePassword=$ANDROID_STORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties
          chmod 600 android/inkpaper-new-release.keystore android/key.properties
      - name: Build debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.release_build }}
        run: dart tool/inkpaper.dart build android-debug
      - name: Build release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_build }}
        run: dart tool/inkpaper.dart build android-release
      - name: Build release AAB
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_build }}
        run: dart tool/inkpaper.dart build android-aab
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-package
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
