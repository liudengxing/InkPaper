name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # 手动触发：只跑门禁与构建，不创建 Release，用来在打 tag 前验证流水线。
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只构建不发布（验证用）"
        type: boolean
        default: true

permissions:
  contents: write

env:
  # 固定到本地验证过的版本。此前用 `channel: stable` 是浮动版本，格式门禁的
  # 结果绑死在 dart_style 上：stable 一升级、格式化规则一变，CI 就会因为与代码
  # 无关的原因变红。升级时改这里一处即可（两个 workflow 各有一份）。
  FLUTTER_VERSION: 3.47.7
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ANDROID_RELEASE_CERT_SHA256: "7A:00:C9:A1:AC:E1:AC:15:0E:79:0C:9D:7A:5B:FC:37:A3:F1:A1:2F:0D:F5:9D:ED:86:27:17:93:C8:40:99:8D"
  UMENG_ANDROID_APPKEY: ${{ secrets.UMENG_ANDROID_APPKEY }}
  UMENG_CHANNEL: ${{ secrets.UMENG_CHANNEL }}
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          version="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)"
          if [ "${DRY_RUN:-false}" = "true" ]; then
            # 手动触发的验证跑没有 tag，直接用 pubspec 版本，产物命名照旧。
            tag="v$version"
            echo "Dry run: artifacts tagged $tag, no release will be created."
          else
            tag="${GITHUB_REF_NAME}"
            if [ "$tag" != "v$version" ]; then
              echo "Tag $tag does not match pubspec version $version." >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - id: notes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release_notes.py CHANGELOG.md "${{ steps.version.outputs.version }}" > release_notes.md
          {
            echo 'notes<<EOF'
            cat release_notes.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_notes.md

  quality:
    name: Analyze + Test
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: dart tool/inkpaper.dart store-check
      - run: dart tool/inkpaper.dart verify --coverage

  release-secrets:
    name: Release secrets
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Verify required release secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          required=(
            ANDROID_KEYSTORE_BASE64
            ANDROID_STORE_PASSWORD
            ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD
          )
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "Missing required release secret: $name" >&2
              exit 1
            fi
          done

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        shell: bash
        run: |
          set -o pipefail
          # 和 gradle 发行包一样，这是 GitHub Releases 的资产下载，会 504 抖动。
          url=https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          for attempt in 1 2 3 4; do
            if curl -sSfL --retry 2 --retry-delay 5 "$url" \
              | sudo tar -xz -C /usr/local/bin gitleaks; then
              break
            fi
            echo "gitleaks download failed (attempt $attempt), retrying"
            sleep 10
          done
          gitleaks version
      - run: gitleaks detect --no-git --redact -v --exit-code=2 --config=.gitleaks.toml

  android:
    name: Android
    runs-on: ubuntu-latest
    needs: [prepare, quality, secret-scan, release-secrets]
    steps:
      - uses: actions/checkout@v4
      # ubuntu-latest 自带 JDK 已到 25，而项目的 Gradle 8.14.3 支持不到那一档，
      # 构建会直接报 "The Java version used for the build is 25.0.5, which is
      # incompatible with Gradle 8.14.3"。钉到本地验证过的 Temurin 17。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # 发行包所有官方地址都会 307 到 GitHub Releases，runner 拉自家 release
      # 资产时不时 504；缓存解压后的发行包，命中的 run 不再走网络。
      - name: Cache Gradle distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-dist-${{ runner.os }}-8.14.3-bin
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: dart tool/inkpaper.dart deps
      - name: Restore Android release credentials
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_STORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/inkpaper-new-release.keystore
          {
            echo "storeFile=../inkpaper-new-release.keystore"
            echo "storePassword=$ANDROID_STORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties
          chmod 600 android/inkpaper-new-release.keystore android/key.properties
          keytool -exportcert \
            -keystore android/inkpaper-new-release.keystore \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass "$ANDROID_STORE_PASSWORD" \
            -rfc > android/release-cert.pem
          actual="$(
            openssl x509 -in android/release-cert.pem -noout -fingerprint -sha256 \
              | cut -d= -f2
          )"
          if [ "$actual" != "$ANDROID_RELEASE_CERT_SHA256" ]; then
            echo "Android release certificate fingerprint mismatch." >&2
            echo "Expected: $ANDROID_RELEASE_CERT_SHA256" >&2
            echo "Actual:   $actual" >&2
            exit 1
          fi
          openssl x509 -in android/release-cert.pem -outform DER -out android/release-cert.der
      - run: dart tool/inkpaper.dart build android-release
      - run: dart tool/inkpaper.dart build android-aab
      - name: Verify Android package certificate
        shell: bash
        run: |
          set -euo pipefail
          expected="$(echo "$ANDROID_RELEASE_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          python3 - <<'PY'
          from pathlib import Path

          cert = Path('android/release-cert.der').read_bytes()
          apk = Path('build/app/outputs/flutter-apk/app-release.apk')
          if cert not in apk.read_bytes():
              raise SystemExit(
                  f'{apk} does not contain the expected release certificate.'
              )
          print(f'{apk}: expected release certificate found')
          PY
          aab_actual="$(
            keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab \
              | awk -F'SHA256: ' '/SHA256:/{print $2; exit}' \
              | tr -d ':' \
              | tr '[:upper:]' '[:lower:]'
          )"
          if [ "$aab_actual" != "$expected" ]; then
            echo "Android AAB certificate fingerprint mismatch." >&2
            exit 1
          fi
          echo "build/app/outputs/bundle/release/app-release.aab: expected release certificate found"
      - name: Rename Android package
        shell: bash
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/InkPaper-${{ needs.prepare.outputs.tag }}-android.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/InkPaper-${{ needs.prepare.outputs.tag }}-android.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            dist/*.apk
            dist/*.aab

  # 目前只发 Android。以后要恢复桌面端 / iOS，从 git 历史里把对应作业搬回来，
  # 并在这里把作业名加回 needs 与 files 列表。
  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [prepare, android]
    # 手动触发的验证跑只到构建为止，不创建 Release。
    if: ${{ inputs.dry_run != true }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-release
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: dist
      - name: List release assets
        shell: bash
        run: find dist -maxdepth 1 -type f -print | sort
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: InkPaper ${{ needs.prepare.outputs.tag }}
          body_path: dist/release_notes.md
          files: |
            dist/*.apk
            dist/*.aab
          draft: false
          prerelease: false
