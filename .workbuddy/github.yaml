# github-release-ops skill 的项目配置（全部字段可选）。
# 只影响发版编排，不影响 git 日常操作。

# Gitee 镜像仓名与 GitHub 不同名（GitHub: InkPaper，Gitee: ink-paper，全小写）。
gitee:
  owner: liudengxing233
  repo: ink-paper
  remote: gitee

build:
  check: dart tool/inkpaper.dart store-check
  cmd: dart tool/inkpaper.dart build android-release
  artifact: build/app/outputs/flutter-apk/app-release.apk

# {version} 不带 v 前缀，{prev} 是上一个 tag；合并多版本说明靠 --since。
notes:
  cmd: python scripts/release_notes.py CHANGELOG.md {version} --since {prev}
  out: dist/release_notes.md

# 装机由人工确认后执行（小米 14 无线调试端口每次都可能变）。
deploy:
  cmd: ""
