plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def hasReleaseSigning = keystoreProperties['storeFile'] &&
        keystoreProperties['storePassword'] &&
        keystoreProperties['keyAlias'] &&
        keystoreProperties['keyPassword']
def isReleaseTask = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains('release')
}
def releaseStoreFile = hasReleaseSigning ? file(keystoreProperties['storeFile']) : null
if (isReleaseTask && !hasReleaseSigning) {
    throw new GradleException('Release builds require android/key.properties with complete signing credentials.')
}
if (isReleaseTask && releaseStoreFile != null && !releaseStoreFile.exists()) {
    throw new GradleException("Release signing keystore was not found: ${releaseStoreFile}")
}
android {
    namespace = "com.didichou.inkpaper"
    compileSdk flutter.compileSdkVersion
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11.toString()
    }

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.didichou.inkpaper"
        minSdkVersion flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
        manifestPlaceholders = [
            applicationName: "android.app.Application",
        ]
        // release 只保留真机 ABI：--target-platform 只能过滤 Flutter 自己的
        // libflutter/libapp，插件自带的 .so（sentry / dartjni 等）由 Gradle 打包，
        // 必须在 defaultConfig 里用 abiFilters 裁。
        // 注意：Flutter 插件 apply 时已把 abiFilters 垫成全平台，直接 add 是追加，
        // 必须先 clear；否则 x86_64 的插件 so 照样进包。
        // debug 保留 x86_64，否则 Android 模拟器装不上。
        ndk {
            abiFilters.clear()
            if (isReleaseTask) {
                abiFilters.addAll(['armeabi-v7a', 'arm64-v8a'])
            } else {
                abiFilters.addAll(['armeabi-v7a', 'arm64-v8a', 'x86_64'])
            }
        }
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile releaseStoreFile
                storePassword keystoreProperties['storePassword']
            }
        }
    }
    
    buildTypes {
        release {
            signingConfig signingConfigs.release
            // 启用代码混淆和压缩
            minifyEnabled true
            // 启用资源压缩
            shrinkResources true
            // 指定ProGuard规则文件
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
