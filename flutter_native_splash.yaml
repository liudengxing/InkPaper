# Flutter Native Splash 配置
# 🎨 使用自定义设计的全屏启动页（1242x2688）
# ✅ 大厂最佳实践：使用 background_image 而不是 color+image，避免两层叠加

flutter_native_splash:
  # 🚀 使用 background_image（全屏背景图，包含所有设计元素）
  # 优势：只生成一张图片，无需叠加，性能更好
  #
  # 明暗主题共用同一张墨绿底图：Android 的 starting window 是系统在进程启动前
  # 按资源限定符（values-night）生成的，运行时改不了；只要留深色变体，系统开着
  # 深色模式时就必然先黑一屏再切浅色界面。用品牌墨绿底后两种主题下都不突兀。
  background_image: assets/images/splash_logo.png
  
  # 图片填充模式（等比例填充，保持宽高比）
  android_gravity: fill_horizontal|fill_vertical|clip_vertical
  
  # 🔥 关键：不使用 image 和 color（避免多层叠加导致出现2个启动页）
  # 设置为 false 防止插件生成 LaunchImage 层
  image: false
  color: false
  
  # Android 12+ 配置（禁用特殊启动页，使用统一的全屏背景图）
  # 大厂做法：所有 Android 版本使用相同的全屏启动图，不用居中图标
  # android_12:
  #   image: assets/images/splash_logo.png
  #   image_dark: assets/images/splash_logo_dark.png
  #   color: "#F5F4F7"
  #   color_dark: "#000000"
  
  # 仅 Android 平台
  android: true
  ios: false
  web: false

  # 全屏启动页
  fullscreen: true

